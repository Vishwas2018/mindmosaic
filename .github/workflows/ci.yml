name: CI

on:
  push:
    branches: [main, 'v1.1/**']
  pull_request:
    branches: [main, 'v1.1/**']

env:
  HUSKY: 0

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run typecheck

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run test

  migration-dryrun:
    name: Migration Dry-Run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate seed file count
        run: |
          COUNT=$(ls supabase/seeds/*.sql 2>/dev/null | wc -l)
          echo "Found $COUNT seed files"
          [ "$COUNT" -ge 6 ] || (echo "Expected ≥6 seed files" && exit 1)
      - name: Check for Supabase CLI + Docker availability
        id: supabase-check
        run: |
          if command -v supabase &> /dev/null && docker info &> /dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Supabase CLI or Docker not available — skipping migration dry-run (pre-deploy gate not yet open)."
          fi
      - uses: supabase/setup-cli@v1
        if: steps.supabase-check.outputs.available == 'true'
        with:
          version: latest
      - name: Migration dry-run
        if: steps.supabase-check.outputs.available == 'true'
        run: supabase db push --dry-run --local

  deploy-functions:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build local packages required by Edge Functions
        run: pnpm turbo run build --filter=@mm/types --filter=@mm/engines
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy all Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          PROJECT_REF=$(echo "$SUPABASE_URL" | sed 's|https://||' | cut -d'.' -f1)
          supabase functions deploy --project-ref "$PROJECT_REF"

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: deploy-functions
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Seed E2E data
        run: pnpm tsx scripts/seed-e2e.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Install Playwright browsers
        run: pnpm --filter @mm/web exec playwright install --with-deps chromium
      - name: Run E2E tests
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_WEB_URL: https://mindmosaic-web-git-v11-exam-content-vishwas2018s-projects.vercel.app
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_ANON: ${{ secrets.E2E_SUPABASE_ANON }}
          E2E_TEST_SERVICE_ROLE: ${{ secrets.E2E_TEST_SERVICE_ROLE }}
          E2E_TEST_PATHWAY_ID: 00000000-e2e0-0000-0000-000000000002
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: pnpm --filter @mm/web e2e
